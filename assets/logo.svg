<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024">

  <title>Eval Tick</title>
  <desc>Purple gradient app icon with a black scalloped badge and white checkmark.</desc>

  <defs>
    <!-- Purple gradient background tile -->
    <linearGradient id="tileGradient"
                    x1="0" y1="0"
                    x2="0.15" y2="1">
      <stop offset="0%" stop-color="#A990FF"/>
      <stop offset="38%" stop-color="#8A6AFF"/>
      <stop offset="72%" stop-color="#704DFF"/>
      <stop offset="100%" stop-color="#5C35FA"/>
    </linearGradient>

    <!-- Soft lavender highlight -->
    <radialGradient id="tileHighlight"
                    cx="20%" cy="5%" r="95%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle glossy depth -->
    <linearGradient id="tileGloss"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3210D9" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Rounded tile clipping -->
    <clipPath id="tileClip">
      <rect x="112" y="100"
            width="800" height="790"
            rx="205"/>
    </clipPath>

    <!-- Badge shadow -->
    <filter id="badgeShadow"
            x="-20%" y="-20%"
            width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha"
                      stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scalloped badge silhouette -->
    <path id="badgeShape"
          d="
            M 512,246
            C 539,246 559,261 576,283
            C 610,272 642,283 661,307
            C 675,324 679,343 676,361
            C 707,380 726,408 724,438
            C 723,458 714,477 699,492
            C 719,520 721,551 704,577
            C 693,593 677,604 658,611
            C 659,643 642,671 612,686
            C 592,696 570,695 550,686
            C 532,711 511,725 487,724
            C 462,723 443,709 428,688
            C 394,699 362,687 343,663
            C 329,646 327,627 330,607
            C 299,588 281,560 283,530
            C 284,509 292,492 306,477
            C 285,448 285,416 304,390
            C 315,375 330,363 348,355
            C 347,323 363,295 391,281
            C 411,271 431,271 451,279
            C 469,257 489,246 512,246
            Z"/>

  </defs>

  <!-- Main rounded-square tile -->
  <g id="appTile">
    <rect x="112" y="100"
          width="800" height="790"
          rx="205"
          fill="url(#tileGradient)"/>

    <g clip-path="url(#tileClip)">
      <rect x="112" y="100"
            width="800" height="790"
            fill="url(#tileHighlight)"/>

      <rect x="112" y="100"
            width="800" height="790"
            fill="url(#tileGloss)"/>

      <!-- Very subtle upper-edge sheen -->
      <path d="
        M 317,103
        H 707
        C 810,103 909,151 909,284
        V 300
        C 909,178 820,108 707,108
        H 317
        C 204,108 115,178 115,300
        V 284
        C 115,151 214,103 317,103
        Z"
        fill="#FFFFFF"
        opacity="0.08"/>
    </g>
  </g>

  <!-- Central certification-style badge -->
  <g id="evalBadge" filter="url(#badgeShadow)">

    <!-- Thick white outer border -->
    <use href="#badgeShape"
         fill="#FFFFFF"/>

    <!-- Black inset badge -->
    <use href="#badgeShape"
         transform="translate(40 36) scale(0.92 0.927)"
         fill="#050505"/>

    <!-- Bold white checkmark -->
    <path d="
      M 400,491
      L 482,580
      L 632,420"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>

</svg>
