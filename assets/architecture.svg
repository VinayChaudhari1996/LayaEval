<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Purple Gradient for SDK -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366F1" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>

    <!-- Subtle Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="380" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subgraph 1: Your Application / Pipeline -->
  <g transform="translate(30, 30)">
    <rect width="250" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="250" height="36" rx="12" fill="#F1F5F9" />
    <rect y="24" width="250" height="12" fill="#F1F5F9" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4F46E5" letter-spacing="0.5">APPLICATION / PIPELINE</text>

    <!-- Input Node A -->
    <rect x="18" y="52" width="214" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="32" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#1E293B">RAG Context &amp; Response</text>

    <!-- Input Node B -->
    <rect x="18" y="106" width="214" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="32" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#1E293B">Agent Execution Trace</text>

    <!-- Target Node C: LayaEval SDK -->
    <rect x="18" y="166" width="214" height="48" rx="8" fill="url(#purpleGrad)" />
    <text x="125" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">LayaEval Python SDK</text>
  </g>

  <!-- Connectors A -> C and B -> C -->
  <path d="M 155 124 L 155 160" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />

  <!-- Connector: C -> D (Between Subgraphs) -->
  <path d="M 280 220 L 332 220" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Subgraph 2: LayaEval Orchestrator -->
  <g transform="translate(340, 30)">
    <rect width="260" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="260" height="36" rx="12" fill="#F1F5F9" />
    <rect y="24" width="260" height="12" fill="#F1F5F9" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4F46E5" letter-spacing="0.5">LAYAEVAL ORCHESTRATOR</text>

    <!-- Step D: Pack Questions -->
    <rect x="18" y="60" width="224" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="130" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Pack Questions &amp; States</text>
    <text x="130" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">42 Typed Neural Evaluators</text>

    <!-- Connector inside Orchestrator -->
    <path d="M 130 118 L 130 144" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step E: Single JSON-RPC -->
    <rect x="18" y="152" width="224" height="58" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
    <text x="130" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Single JSON-RPC Batch</text>
    <text x="130" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6366F1" text-anchor="middle">Zero-Cost Stdio Transport</text>
  </g>

  <!-- Connector: E -> F (Between Subgraphs) -->
  <path d="M 600 210 L 652 210" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Subgraph 3: Laya MCP Server -->
  <g transform="translate(660, 30)">
    <rect width="270" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="270" height="36" rx="12" fill="#F1F5F9" />
    <rect y="24" width="270" height="12" fill="#F1F5F9" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4F46E5" letter-spacing="0.5">LAYA MCP SERVER</text>

    <!-- Step F: Neural Model -->
    <rect x="18" y="60" width="234" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="135" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Non-Autoregressive Model</text>
    <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">No LLM Judge API Overhead</text>

    <!-- Connector inside MCP Server -->
    <path d="M 135 118 L 135 144" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step G: Forward Pass -->
    <rect x="18" y="152" width="234" height="58" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
    <text x="135" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="middle">Multi-Question Forward Pass</text>
    <text x="135" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#16A34A" text-anchor="middle">Sub-50ms Parallel Latency</text>
  </g>

  <!-- Feedback Loop Banner: Bottom Bar -->
  <g transform="translate(30, 285)">
    <rect width="900" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="1" y="1" width="898" height="3" rx="2" fill="#10B981" />

    <!-- Return Path Arrow -->
    <path d="M 795 -25 L 795 24 L 155 24 L 155 -20" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />

    <!-- Result Banner Text -->
    <rect x="335" y="14" width="270" height="20" rx="4" fill="#FFFFFF" />
    <text x="470" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">CALIBRATED VERDICTS RETURNED</text>
    <text x="470" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Score (0–4) • Probability P(true) • Statistical Confidence • Automated Pass / Fail</text>
  </g>
</svg>
