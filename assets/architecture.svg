<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="100%" stop-color="#131620" />
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A990FF" />
      <stop offset="100%" stop-color="#704DFF" />
    </linearGradient>

    <!-- Node Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1E29" />
      <stop offset="100%" stop-color="#141722" />
    </linearGradient>

    <!-- Highlight Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6AFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#8A6AFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8A6AFF" stop-opacity="0" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8A6AFF" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3FB950" />
    </marker>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="380" rx="16" fill="url(#bgGrad)" stroke="#262C3A" stroke-width="1.5" />

  <!-- Subgraph 1: Your Application / Pipeline -->
  <g transform="translate(30, 30)">
    <rect width="250" height="230" rx="12" fill="url(#cardGrad)" stroke="#303848" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="250" height="36" rx="12" fill="#1F2432" />
    <rect y="24" width="250" height="12" fill="#1F2432" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8A6AFF" letter-spacing="0.5">APPLICATION / PIPELINE</text>

    <!-- Input Node A -->
    <rect x="18" y="52" width="214" height="42" rx="8" fill="#10131B" stroke="#2B3242" stroke-width="1" />
    <text x="32" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#E6EDF3">🔍 RAG Context &amp; Response</text>

    <!-- Input Node B -->
    <rect x="18" y="106" width="214" height="42" rx="8" fill="#10131B" stroke="#2B3242" stroke-width="1" />
    <text x="32" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#E6EDF3">🤖 Agent Execution Trace</text>

    <!-- Target Node C: LayaEval SDK -->
    <rect x="18" y="166" width="214" height="48" rx="8" fill="url(#purpleGrad)" />
    <text x="125" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">LayaEval Python SDK</text>
  </g>

  <!-- Connectors A -> C and B -> C -->
  <path d="M 155 124 L 155 160" stroke="#8A6AFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Connector: C -> D (Between Subgraphs) -->
  <path d="M 280 220 L 332 220" stroke="#8A6AFF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Subgraph 2: LayaEval Orchestrator -->
  <g transform="translate(340, 30)">
    <rect width="260" height="230" rx="12" fill="url(#cardGrad)" stroke="#303848" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="260" height="36" rx="12" fill="#1F2432" />
    <rect y="24" width="260" height="12" fill="#1F2432" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8A6AFF" letter-spacing="0.5">LAYAEVAL ORCHESTRATOR</text>

    <!-- Step D: Pack Questions -->
    <rect x="18" y="60" width="224" height="58" rx="8" fill="#10131B" stroke="#2B3242" stroke-width="1" />
    <text x="130" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="middle">Pack Questions &amp; States</text>
    <text x="130" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">42 Typed Neural Evaluators</text>

    <!-- Connector inside Orchestrator -->
    <path d="M 130 118 L 130 144" stroke="#8A6AFF" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step E: Single JSON-RPC -->
    <rect x="18" y="152" width="224" height="58" rx="8" fill="#10131B" stroke="#3D475C" stroke-width="1.2" />
    <text x="130" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A990FF" text-anchor="middle">Single JSON-RPC Batch</text>
    <text x="130" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">Zero-Cost Stdio Transport</text>
  </g>

  <!-- Connector: E -> F (Between Subgraphs) -->
  <path d="M 600 210 L 652 210" stroke="#8A6AFF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Subgraph 3: Laya MCP Server -->
  <g transform="translate(660, 30)">
    <rect width="270" height="230" rx="12" fill="url(#cardGrad)" stroke="#303848" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="270" height="36" rx="12" fill="#1F2432" />
    <rect y="24" width="270" height="12" fill="#1F2432" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8A6AFF" letter-spacing="0.5">LAYA MCP SERVER</text>

    <!-- Step F: Neural Model -->
    <rect x="18" y="60" width="234" height="58" rx="8" fill="#10131B" stroke="#2B3242" stroke-width="1" />
    <text x="135" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="middle">Non-Autoregressive Model</text>
    <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">No LLM Judge API Overhead</text>

    <!-- Connector inside MCP Server -->
    <path d="M 135 118 L 135 144" stroke="#8A6AFF" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step G: Forward Pass -->
    <rect x="18" y="152" width="234" height="58" rx="8" fill="#10131B" stroke="#3D475C" stroke-width="1.2" />
    <text x="135" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58A6FF" text-anchor="middle">Multi-Question Forward Pass</text>
    <text x="135" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#3FB950" text-anchor="middle">⚡ Sub-50ms Parallel Latency</text>
  </g>

  <!-- Feedback Loop Banner: Bottom Bar -->
  <g transform="translate(30, 285)">
    <rect width="900" height="65" rx="10" fill="#161B26" stroke="#2D3342" stroke-width="1.2" />
    <rect x="1" y="1" width="898" height="3" rx="2" fill="url(#sheenGrad)" />

    <!-- Return Path Arrow -->
    <path d="M 795 -25 L 795 24 L 155 24 L 155 -20" stroke="#3FB950" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />

    <!-- Result Banner Text -->
    <rect x="335" y="14" width="270" height="20" rx="4" fill="#161B26" />
    <text x="470" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3FB950" text-anchor="middle">CALIBRATED VERDICTS RETURNED</text>
    <text x="470" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#C9D1D9" text-anchor="middle">Score (0–4) • Probability P(true) • Statistical Confidence • Automated Pass / Fail</text>
  </g>
</svg>
