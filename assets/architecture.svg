<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'IBM Plex Mono', Menlo, Monaco, monospace;
      }
      .sans {
        font-family: 'Geist Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>

    <!-- Vercel Multi-Stop Mesh Accent Gradient (Single Hero Flourish) -->
    <linearGradient id="geistMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007cf0" />
      <stop offset="25%" stop-color="#00dfd8" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="75%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#f9cb28" />
    </linearGradient>

    <!-- Whisper Micro-Shadow (Level 1: 0px 1px 2px rgba(0,0,0,0.04)) -->
    <filter id="whisperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#171717" />
    </marker>
    <marker id="arrowMute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8f8f8f" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0070f3" />
    </marker>
  </defs>

  <!-- Canvas Surface ({colors.canvas}: #fafafa) with 1px Hairline ({colors.hairline}: #ebebeb) -->
  <rect width="960" height="430" rx="16" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />

  <!-- Top Decorative Mesh Accent Line -->
  <rect x="0" y="0" width="960" height="2" rx="1" fill="url(#geistMesh)" />

  <!-- ==================== COLUMN 1: CLIENT APPLICATION ==================== -->
  <g transform="translate(32, 28)">
    <rect width="264" height="276" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1" filter="url(#whisperShadow)" />

    <!-- Technical Eyebrow -->
    <text x="20" y="32" class="mono" font-size="11" font-weight="500" fill="#8f8f8f" letter-spacing="0.5">01 // CLIENT APPLICATION</text>

    <!-- Node A: RAG Input -->
    <rect x="16" y="48" width="232" height="48" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="68" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">RAG Context &amp; Response</text>
    <text x="28" y="84" class="sans" font-size="11" font-weight="400" fill="#8f8f8f">Queries, chunks &amp; generated text</text>

    <!-- Node B: Agent Trace -->
    <rect x="16" y="104" width="232" height="48" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="124" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">Agent Execution Trace</text>
    <text x="28" y="140" class="sans" font-size="11" font-weight="400" fill="#8f8f8f">Multi-turn tool calls &amp; state</text>

    <!-- Input to SDK Connector -->
    <path d="M 132 152 L 132 166" stroke="#8f8f8f" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowMute)" />

    <!-- Node C: LayaEval SDK (Primary Ink Fill: #171717) -->
    <rect x="16" y="170" width="232" height="88" rx="8" fill="#171717" stroke="#171717" stroke-width="1" />
    <text x="28" y="198" class="sans" font-size="14" font-weight="600" fill="#ffffff" letter-spacing="-0.3">LayaEval Python SDK</text>
    <text x="28" y="218" class="mono" font-size="11" font-weight="400" fill="#8f8f8f">pip install layaeval</text>
    <text x="28" y="238" class="sans" font-size="11" font-weight="400" fill="#a1a1a1">Native async client &amp; batcher</text>
  </g>

  <!-- Horizontal Pipeline Connector: Col 1 -> Col 2 -->
  <path d="M 296 242 L 348 242" stroke="#171717" stroke-width="1.5" marker-end="url(#arrowInk)" />

  <!-- ==================== COLUMN 2: ORCHESTRATION ==================== -->
  <g transform="translate(348, 28)">
    <rect width="264" height="276" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1" filter="url(#whisperShadow)" />

    <!-- Technical Eyebrow -->
    <text x="20" y="32" class="mono" font-size="11" font-weight="500" fill="#8f8f8f" letter-spacing="0.5">02 // ORCHESTRATION</text>

    <!-- Step D: Pack Questions & States -->
    <rect x="16" y="48" width="232" height="92" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="74" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">Pack Questions &amp; States</text>
    <text x="28" y="94" class="sans" font-size="12" font-weight="400" fill="#4d4d4d">42 typed neural decision tasks</text>
    <text x="28" y="118" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">SCORE (0-4) • P(TRUE) • RISK</text>

    <!-- Step D -> Step E Connector -->
    <path d="M 132 140 L 132 164" stroke="#8f8f8f" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowMute)" />

    <!-- Step E: Single JSON-RPC Batch -->
    <rect x="16" y="168" width="232" height="92" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="194" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">Single JSON-RPC Batch</text>
    <text x="28" y="214" class="sans" font-size="12" font-weight="400" fill="#4d4d4d">Zero-cost stdio subprocess</text>
    <text x="28" y="238" class="mono" font-size="10" font-weight="500" fill="#0070f3">MCP PROTOCOL 2.2+</text>
  </g>

  <!-- Horizontal Pipeline Connector: Col 2 -> Col 3 -->
  <path d="M 612 242 L 664 242" stroke="#171717" stroke-width="1.5" marker-end="url(#arrowInk)" />

  <!-- ==================== COLUMN 3: LAYA MCP ENGINE ==================== -->
  <g transform="translate(664, 28)">
    <rect width="264" height="276" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1" filter="url(#whisperShadow)" />

    <!-- Technical Eyebrow -->
    <text x="20" y="32" class="mono" font-size="11" font-weight="500" fill="#8f8f8f" letter-spacing="0.5">03 // LAYA MCP ENGINE</text>

    <!-- Step F: Neural Model -->
    <rect x="16" y="48" width="232" height="92" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="74" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">Non-Autoregressive Model</text>
    <text x="28" y="94" class="sans" font-size="12" font-weight="400" fill="#4d4d4d">Zero external LLM token fees</text>
    <text x="28" y="118" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">CALIBRATED HEAD ENSEMBLE</text>

    <!-- Step F -> Step G Connector -->
    <path d="M 132 140 L 132 164" stroke="#8f8f8f" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowMute)" />

    <!-- Step G: Parallel Forward Pass -->
    <rect x="16" y="168" width="232" height="92" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="28" y="194" class="sans" font-size="13" font-weight="600" fill="#171717" letter-spacing="-0.3">Parallel Forward Pass</text>
    <text x="28" y="214" class="sans" font-size="12" font-weight="400" fill="#4d4d4d">Sub-50ms deterministic run</text>
    <text x="28" y="238" class="mono" font-size="10" font-weight="500" fill="#171717">CUDA • MPS • CPU</text>
  </g>

  <!-- ==================== BOTTOM SPEC BAND: OUTPUT CONTRACT ==================== -->
  <g transform="translate(32, 324)">
    <rect width="896" height="82" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1" filter="url(#whisperShadow)" />

    <!-- Top Left Eyebrow -->
    <text x="20" y="24" class="mono" font-size="10" font-weight="500" fill="#8f8f8f" letter-spacing="0.5">OUTPUT CONTRACT // CALIBRATED VERDICTS</text>

    <!-- Spec Cell 1: Score -->
    <rect x="20" y="34" width="160" height="36" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="30" y="49" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">SCORE</text>
    <text x="30" y="62" class="sans" font-size="11" font-weight="600" fill="#171717">0.0 – 4.0 Continuous</text>

    <!-- Spec Cell 2: Probability -->
    <rect x="190" y="34" width="160" height="36" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="200" y="49" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">PROBABILITY</text>
    <text x="200" y="62" class="sans" font-size="11" font-weight="600" fill="#171717">P(true) • Likelihood</text>

    <!-- Spec Cell 3: Confidence -->
    <rect x="360" y="34" width="160" height="36" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="370" y="49" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">CONFIDENCE</text>
    <text x="370" y="62" class="sans" font-size="11" font-weight="600" fill="#171717">Statistical Bounds</text>

    <!-- Spec Cell 4: Automated Pass/Fail -->
    <rect x="530" y="34" width="160" height="36" rx="6" fill="#fafafa" stroke="#ebebeb" stroke-width="1" />
    <text x="540" y="49" class="mono" font-size="10" font-weight="500" fill="#8f8f8f">VERDICT</text>
    <text x="540" y="62" class="sans" font-size="11" font-weight="600" fill="#171717">Threshold Pass / Fail</text>

    <!-- Right Latency Pill ({rounded.pill}) -->
    <rect x="732" y="28" width="148" height="38" rx="19" fill="#171717" />
    <text x="806" y="44" class="mono" font-size="9" font-weight="500" fill="#a1a1a1" text-anchor="middle" letter-spacing="0.5">LATENCY BENCHMARK</text>
    <text x="806" y="57" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">&lt; 50ms / Eval</text>
  </g>
</svg>
